name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            wails_platform: windows/amd64
            output_name: trackplan-windows-amd64.exe
            archive_name: trackplan-v1.0.0-windows-amd64.zip

          - name: macOS
            os: macos-latest
            wails_platform: darwin/universal
            output_name: trackplan.app
            archive_name: trackplan-v1.0.0-macos-universal.zip

          - name: Linux
            os: ubuntu-22.04
            wails_platform: linux/amd64
            output_name: trackplan
            archive_name: trackplan-v1.0.0-linux-amd64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Desktop Application
        run: wails build -platform ${{ matrix.platform.wails_platform }} -s

      - name: Archive Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "build\bin\trackplan.exe" -Destination "trackplan-windows-amd64.exe"
          Compress-Archive -Path "build\bin\trackplan.exe" -DestinationPath "${{ matrix.platform.archive_name }}"

      - name: Archive Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ../../${{ matrix.platform.archive_name }} trackplan.app

      - name: Archive Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czvf ../../${{ matrix.platform.archive_name }} trackplan

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.platform.archive_name }}
            *.exe
          generate_release_notes: true
